name: MacOS-arm64 📦

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
    branches: [ macos-workflow, build-all ]


jobs:
  build-n-publish:
    name: Build📦 for MacOS
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      CMAKE_OSX_ARCHITECTURES: "arm64;x86_64"

    strategy:
      matrix:
        python-version: [ '3.11.0' ] # versions under 3.11 are not supported on arm64
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install build deps
        run: |
          python -m pip install --upgrade setuptools
          python -m pip install wheel

      - name: Build a binary wheel
        run: |
          python setup.py bdist_wheel
      
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.python-version }}
          path: dist/*.whl

      - name: Test built wheel and v3 callback lifetimes
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -I -X dev -X faulthandler -m unittest discover -s tests -v

      - name: Install twine
        run: python -m pip install twine

      # - name: Publish distribution to PyPI
      #   env:
      #     TWINE_USERNAME: __token__
      #     TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      #   run: twine upload dist/* --skip-existing

      - name: Upload Wheel to Release
        uses: softprops/action-gh-release@v2
        with:
          # tag_name: v0.4.3
          files: |
            dist/*.whl
